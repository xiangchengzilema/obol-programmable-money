services:
  - type: web
    name: obol-programmable-money
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --chdir backend --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    renderSubdomainPolicy: enabled
    envVars:
      - key: OBOL_PUBLIC_DEMO
        value: "1"
      - key: OBOL_FORCE_MOCK
        value: "1"
      - key: OBOL_DISABLE_DEMO_RESET
        value: "1"
      - key: OBOL_AUTO_SEED
        value: "1"
      - key: FLASK_DEBUG
        value: "0"
